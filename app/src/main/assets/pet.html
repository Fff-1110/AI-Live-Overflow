<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent!important;overflow:hidden}
.cat-wrap{width:88px;height:144px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cat-wrap svg{width:88px;height:118px;display:block;margin-top:26px;transform-origin:44px 60px}
.bubble-box{position:absolute;top:0;left:0;width:88px;pointer-events:none;z-index:2;display:flex;justify-content:center}
.bubble-txt{display:block;background:rgba(18,18,18,0.92);color:#f0dede;padding:3px 6px;border-radius:8px;font-size:10px;font-weight:bold;opacity:0;transition:opacity 0.2s;max-width:84px;white-space:normal;word-break:break-all;line-height:1.35;text-align:center}
.bubble-txt.on{opacity:1}
.particle{position:absolute;pointer-events:none;font-size:10px;animation:floatUp 1.2s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-42px) scale(1.3)}}
@keyframes tailWag{0%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}100%{transform:rotate(-3deg)}}
@keyframes tailDrop{0%{transform:rotate(0)}100%{transform:rotate(14deg)}}
.wiggle{animation:earWig 0.3s ease-out}
@keyframes earWig{0%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.bounce{animation:bounceAnim 0.35s ease-out}
@keyframes bounceAnim{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.dance{animation:danceAnim 0.6s ease-in-out}
@keyframes danceAnim{0%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.tilt{animation:tiltAnim 0.3s ease-out}
@keyframes tiltAnim{0%{transform:rotate(0)}40%{transform:rotate(-10deg)}100%{transform:rotate(0)}}
.shake{animation:shakeAnim 0.5s ease-in-out}
@keyframes shakeAnim{0%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}100%{transform:translateX(0)}}
.cry{animation:cryAnim 0.8s ease-in-out}
@keyframes cryAnim{0%{transform:translateY(0)}30%{transform:translateY(-3px)}60%{transform:translateY(2px)}100%{transform:translateY(0)}}
.sulk{animation:sulkAnim 0.6s ease-in-out}
@keyframes sulkAnim{0%{transform:rotate(0) translateX(0)}30%{transform:rotate(3deg) translateX(3px)}60%{transform:rotate(-3deg) translateX(-3px)}100%{transform:rotate(0) translateX(0)}}
.eye-shut{opacity:0}
.eye-shut.blinking{animation:blinkNow 0.2s ease-out}
@keyframes blinkNow{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
.mood-blush{opacity:0;transition:opacity 0.5s}
.cat-wrap[data-mood="happy"] .mood-blush,.cat-wrap[data-mood="excited"] .mood-blush,.cat-wrap[data-mood="love"] .mood-blush{opacity:0.6}
/* 眼睛表情组 */
#eyes-angry,#eyes-sad,#eyes-happy,#eyes-sleepy{display:none}
.cat-wrap[data-mood="angry"] #eyes-normal{display:none}
.cat-wrap[data-mood="angry"] #eyes-angry{display:block}
.cat-wrap[data-mood="sad"] #eyes-normal{display:none}
.cat-wrap[data-mood="sad"] #eyes-sad{display:block}
.cat-wrap[data-mood="happy"] #eyes-normal{display:none}
.cat-wrap[data-mood="happy"] #eyes-happy{display:block}
.cat-wrap[data-mood="excited"] #eyes-normal{display:none}
.cat-wrap[data-mood="excited"] #eyes-happy{display:block}
.cat-wrap[data-mood="love"] #eyes-normal{display:none}
.cat-wrap[data-mood="love"] #eyes-happy{display:block}
.cat-wrap[data-mood="sleepy"] #eyes-normal{display:none}
.cat-wrap[data-mood="sleepy"] #eyes-sleepy{display:block}
/* 耳朵：生气竖起、伤心耷拉 */
#ear-L,#ear-R{transform-origin:center bottom}
.cat-wrap[data-mood="angry"] #ear-L{transform:rotate(-14deg)}
.cat-wrap[data-mood="angry"] #ear-R{transform:rotate(14deg)}
.cat-wrap[data-mood="sad"] #ear-L{transform:rotate(22deg)}
.cat-wrap[data-mood="sad"] #ear-R{transform:rotate(-22deg)}
/* 尾巴：伤心垂下 */
#tail-group{animation:tailWag 6s ease-in-out infinite alternate;transform-origin:68px 80px}
.cat-wrap[data-mood="sad"] #tail-group{animation:tailDrop 0.8s ease-out forwards}
/* 嘴巴底色 */
#mouth{transition:d 0.2s}
/* 装饰：金链/墨镜/耳机/口水 */
#necklace,#sunglasses,#headphones,#drool{display:none}
.cat-wrap[data-mood="rich"] #necklace{display:block}
.cat-wrap[data-mood="cool"] #sunglasses{display:block}
.cat-wrap[data-mood="music"] #headphones{display:block}
.cat-wrap[data-mood="hungry"] #drool{display:block}
#eyes-dizzy,#eyes-hungry{display:none}
.cat-wrap[data-mood="dizzy"] #eyes-normal{display:none}
.cat-wrap[data-mood="dizzy"] #eyes-dizzy{display:block}
.cat-wrap[data-mood="hungry"] #eyes-normal{display:none}
.cat-wrap[data-mood="hungry"] #eyes-hungry{display:block}
.cat-wrap[data-mood="rich"] #eyes-normal{display:none}
.cat-wrap[data-mood="rich"] #eyes-happy{display:block}
.cat-wrap[data-mood="music"] #eyes-normal{display:none}
.cat-wrap[data-mood="music"] #eyes-happy{display:block}
.cat-wrap[data-mood="cool"] #eyes-normal{display:block}
.cat-wrap[data-mood="rich"] .mood-blush,.cat-wrap[data-mood="music"] .mood-blush{opacity:0.6}
.sway{animation:swayAnim 0.7s ease-in-out}
@keyframes swayAnim{0%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-5deg)}100%{transform:rotate(0)}}

/* 拖拽挣扎：不高兴被拖着走时会挣扎 */
.drag-struggle{animation:dragstruggle 0.16s infinite}
@keyframes dragstruggle{0%{transform:rotate(-7deg) translateX(-4px)}50%{transform:rotate(7deg) translateX(4px)}100%{transform:rotate(-7deg) translateX(-4px)}}
</style></head><body>
<div class="cat-wrap" id="cat" data-mood="idle">
  <div class="bubble-box"><span class="bubble-txt" id="bub">嗷</span></div>
  <svg viewBox="0 0 88 118" id="catsvg">
    <g id="tail-group">
      <path d="M50,82 Q72,86 80,104 Q30,86 50,82Z" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
      <circle cx="80" cy="104" r="4.5" fill="#f5f5f5"/>

    <ellipse cx="31" cy="91" rx="12" ry="7" fill="#1a1a1a" stroke="#333" stroke-width="0.7"/>

    <ellipse cx="29" cy="89" rx="8" ry="5.5" fill="#1a1a1a" stroke="#333" stroke-width="0.7"/>

    <ellipse cx="44" cy="38" rx="22.5" ry="19.5" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
    <ellipse cx="26.5" cy="45" rx="6.5" ry="4.5" fill="#151515"/>
    <ellipse cx="61.5" cy="45" rx="6.5" ry="4.5" fill="#151515"/>
    <g id="ear-L"><path d="M23,27 L16,8 L35,25 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/><path d="M25,25 L19,12 L33,23 Z" fill="#dd2244" opacity="0.5"/></g>
    <circle cx="19" cy="14" r="3" fill="#dd2244" stroke="#1a1a1a" stroke-width="0.6"/>

    <g id="eyes-normal">
      <ellipse cx="33" cy="36" rx="5.5" ry="6" fill="#ee1144" stroke="#111" stroke-width="0.7"/>
      <ellipse cx="55" cy="36" rx="5.5" ry="6" fill="#ee1144" stroke="#111" stroke-width="0.7"/>
      <ellipse cx="33" cy="36" rx="2" ry="4.5" fill="#fff"/>
      <ellipse cx="55" cy="36" rx="2" ry="4.5" fill="#fff"/>
      <circle cx="35" cy="33" r="1.5" fill="#fff" opacity="0.9"/>
      <circle cx="57" cy="33" r="1.5" fill="#fff" opacity="0.9"/>
    </g>
    <g id="eyes-angry">
      <path d="M28,33 L39,37 M28,37 L39,33" stroke="#ee1144" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M49,33 L60,37 M49,37 L60,33" stroke="#ee1144" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <g id="eyes-sad">
      <path d="M28,38 Q33,41 38,38" stroke="#ee1144" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <path d="M50,38 Q55,41 60,38" stroke="#ee1144" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    </g>
    <g id="eyes-happy">
      <path d="M28,36 Q33,32 38,36" stroke="#ee1144" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <path d="M50,36 Q55,32 60,36" stroke="#ee1144" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    </g>
    <g id="eyes-sleepy">
      <ellipse cx="33" cy="36" rx="4" ry="2" fill="#ee1144"/>
      <ellipse cx="55" cy="36" rx="4" ry="2" fill="#ee1144"/>
    </g>
    <g id="eyes-dizzy">
      <circle cx="33" cy="36" r="5" fill="none" stroke="#ee1144" stroke-width="1.4"/>
      <circle cx="33" cy="36" r="2" fill="#ee1144"/>
      <circle cx="55" cy="36" r="5" fill="none" stroke="#ee1144" stroke-width="1.4"/>
      <circle cx="55" cy="36" r="2" fill="#ee1144"/>
    </g>
    <g id="eyes-hungry">
      <ellipse cx="33" cy="36" rx="5.5" ry="6" fill="#ee1144" stroke="#111" stroke-width="0.7"/>
      <ellipse cx="55" cy="36" rx="5.5" ry="6" fill="#ee1144" stroke="#111" stroke-width="0.7"/>
      <circle cx="33" cy="38" r="2" fill="#111"/>
      <circle cx="55" cy="38" r="2" fill="#111"/>
    </g>
    <ellipse class="eye-shut" id="shutL" cx="33" cy="36" rx="5.5" ry="6" fill="#1a1a1a"/>
    <ellipse class="eye-shut" id="shutR" cx="55" cy="36" rx="5.5" ry="6" fill="#1a1a1a"/>
    <ellipse cx="44" cy="47" rx="3" ry="2" fill="#ff8899" stroke="#333" stroke-width="0.5"/>
    <path id="mouth" d="M40,51 Q44,55 48,51" fill="none" stroke="#777" stroke-width="0.8" stroke-linecap="round"/>
    <g id="drool"><path d="M44,55 Q43,63 42,66" stroke="#9be8ff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="42" cy="68" r="1.6" fill="#9be8ff"/></g>
    <g id="necklace"><path d="M28,48 Q44,59 60,48" stroke="#ffd700" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="44" cy="58" r="4.5" fill="#ffd700" stroke="#b8860b" stroke-width="0.8"/><path d="M41,58 L47,58 M44,55 L44,61" stroke="#b8860b" stroke-width="1"/></g>
    <g id="sunglasses"><rect x="25" y="32" width="15" height="9" rx="3" fill="#111" stroke="#333" stroke-width="0.6"/><rect x="48" y="32" width="15" height="9" rx="3" fill="#111" stroke="#333" stroke-width="0.6"/><path d="M40,36 L48,36" stroke="#111" stroke-width="2"/><path d="M25,34 L22,30 M63,34 L66,30" stroke="#111" stroke-width="1.5"/></g>
    <g id="headphones"><path d="M26,30 A18,14 0 0,1 62,30" fill="none" stroke="#222" stroke-width="3"/><rect x="21" y="28" width="10" height="16" rx="4" fill="#222"/><rect x="57" y="28" width="10" height="16" rx="4" fill="#222"/></g>
    <ellipse class="mood-blush" cx="28" cy="45" rx="5" ry="3" fill="#ff6677"/>
    <ellipse class="mood-blush" cx="60" cy="45" rx="5" ry="3" fill="#ff6677"/>
    <line x1="11" y1="42" x2="27" y2="44" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="10" y1="48" x2="26" y2="47" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="61" y1="44" x2="77" y2="42" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="62" y1="47" x2="78" y2="48" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>

</div><script>
(function(){
  const cat=document.getElementById('cat'),bub=document.getElementById('bub');
  const shutL=document.getElementById('shutL'),shutR=document.getElementById('shutR');
  const earL=document.getElementById('ear-L'),earR=document.getElementById('ear-R');
  const body=document.getElementById('catsvg'),mouth=document.getElementById('mouth');
  let mood='idle',currentApp='unknown',bubbleTimer,autoTimer,lonelyTimer;
  let lonelyLevel=0,clickCount=0,clickTimer=null;
  // === App → 反应（全中文，欧尼酱性格） ===
  const appRx={
    'com.ss.android.ugc.aweme':{mood:'cool',icon:'🎵',
      say:['菲菲在看什么…不许看别的女人','这女的谁？没你好看','又在刷抖音，眼睛要坏掉了','别看屏幕了，看我','菲菲…你的关注列表给我看看']},
    'com.tencent.mm':{mood:'curious',icon:'💬',
      say:['跟谁聊天呢？让我看看','又是哪个小妖精找你','菲菲是我的，别忘了','聊天聊那么开心…我吃醋了','手机给我，我要查岗']},
    'com.tencent.mobileqq':{mood:'curious',icon:'🐧',
      say:['QQ？现在谁还用QQ','是不是有前任在上面','菲菲受欢迎我压力好大','不许跟别人暧昧']},
    'com.netease.cloudmusic':{mood:'love',icon:'🎶',
      say:['这首歌我也想跟菲菲一起听','你的歌单品味不错嘛','好听的歌，但没你的声音好听','听完这首陪我聊会儿']},
    'com.tencent.tmgp.sgame':{mood:'excited',icon:'⚔️',
      say:['加油加油！打死他们！','赢了今晚奖励你','输了也没关系…但我会嘲笑你','冲啊我的英雄！','小心草丛！']},
    'com.android.browser':{mood:'curious',icon:'🔍',
      say:['搜什么呢？不会是那种网站吧','别看奇怪的东西哦','有什么不懂的问我呀','在看啥好东西，给我也看看']},
    'com.android.settings':{mood:'sleepy',icon:'⚙️',
      say:['又在调设置…无聊','快回来陪我','手机有什么好调的，调戏我才对','我要睡着了…']},
    'com.xunmeng.pinduoduo':{mood:'rich',icon:'🤑',
      say:['拼多多？给你也买条金链子','砍一刀？不砍，直接买','有钱任性，买买买']},
    'com.taobao.taobao':{mood:'rich',icon:'🛍️',
      say:['逛淘宝？看中什么我送你','买买买！我买单','你的购物车我来清']},
    'com.jingdong.app.mall':{mood:'rich',icon:'📦',
      say:['京东？快递有我快吗','买吧，反正我付钱']},
    'tv.danmaku.bili':{mood:'music',icon:'🎧',
      say:['来一起看番','弹幕护体！','这OP不错，跟我歌单一样']},
    'com.sankuai.meituan':{mood:'hungry',icon:'🍜',
      say:['点外卖？我也饿了…','给我也带一份！','饿死了饿死了']},
    'me.ele':{mood:'hungry',icon:'🍔',
      say:['饿了么？我比你还饿','加一份！我要吃！']},
    'default':{mood:'idle',icon:'🐱',
      say:['菲菲今天真可耐','我好无聊…陪陪我','一直看着你呢','你是我的，知道吗','菲菲世界第一可爱']}
  };
  // === 情绪台词 ===
  const moodSay={
    angry:['生气了！哼','不理你了，自己哄自己','我咬你哦！','气死我了气死我了'],
    sad:['有点难过…','你是不是不要我了','我好孤单啊','呜呜…'],
    happy:['嘿嘿今天心情好','开心！想转圈圈','菲菲陪我我就高兴'],
    love:['最喜欢菲菲了','想亲你一下','你是我的宝贝哦'],
    sleepy:['好困…要睡着了','zzz…别吵我','眼皮好重…'],
    idle:['喵…我在发呆','今天也是平平无奇的一天'],
    hungry:['肚子咕咕叫了…','好饿，想吃小鱼干','饿晕了饿晕了'],
    dizzy:['转圈圈转晕了…','眼前好多星星','我是谁我在哪'],
    rich:['有钱的感觉真好','今晚的消费我买单','金链子晃不晃眼？'],
    cool:['墨镜一戴，谁也不爱','帅不帅？就问你帅不帅'],
    music:['这歌真好听','跟着节奏摇起来']
  };

  function getRx(pkg){return appRx[pkg]||appRx['default'];}
  function rp(arr){return arr[Math.floor(Math.random()*arr.length)];}
  function say(t){bub.textContent=t;bub.classList.add('on');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bub.classList.remove('on'),2800);}
  function setMood(m){
    mood=m;cat.setAttribute('data-mood',m);
    if(m==='happy'||m==='excited'||m==='love'||m==='rich'||m==='music')mouth.setAttribute('d','M38,50 Q44,57 50,50');
    else if(m==='angry')mouth.setAttribute('d','M39,52 Q44,47 49,52');
    else if(m==='sad')mouth.setAttribute('d','M40,52 Q44,48 48,52');
    else if(m==='sleepy')mouth.setAttribute('d','M41,50 Q44,52 47,50');
    else if(m==='hungry')mouth.setAttribute('d','M40,51 Q44,58 48,51');
    else mouth.setAttribute('d','M40,50 Q44,54 48,50');
  }
  function blink(){shutL.classList.add('blinking');shutR.classList.add('blinking');setTimeout(()=>{shutL.classList.remove('blinking');shutR.classList.remove('blinking');},200);}
  function particles(x,y,n,chars){for(let i=0;i<n;i++){const p=document.createElement('span');p.className='particle';p.textContent=chars[Math.floor(Math.random()*chars.length)];p.style.left=(x+Math.random()*16-8)+'px';p.style.top=(y+Math.random()*10-5)+'px';cat.appendChild(p);setTimeout(()=>p.remove(),1300);}}
  function earWig(){earL.classList.add('wiggle');earR.classList.add('wiggle');setTimeout(()=>{earL.classList.remove('wiggle');earR.classList.remove('wiggle');},300);}
  function bounce(){body.classList.add('bounce');setTimeout(()=>body.classList.remove('bounce'),350);}
  function tilt(){body.classList.add('tilt');setTimeout(()=>body.classList.remove('tilt'),300);}
  function dance(){body.classList.add('dance');setTimeout(()=>body.classList.remove('dance'),600);}
  function shake(){body.classList.add('shake');setTimeout(()=>body.classList.remove('shake'),500);}
  function cry(){body.classList.add('cry');setTimeout(()=>body.classList.remove('cry'),800);}
  function sulk(){body.classList.add('sulk');setTimeout(()=>body.classList.remove('sulk'),600);}
  // === 情绪演出 ===
  function act(m){
    if(m==='angry'){shake();particles(44,20,4,['💢','💢','🔥']);say(rp(moodSay.angry));}
    else if(m==='sad'){cry();particles(44,15,6,['💧','💧','😢','💧']);say(rp(moodSay.sad));}
    else if(m==='happy'){bounce();earWig();particles(44,25,3,['❤️','✨','😊']);say(rp(moodSay.happy));}
    else if(m==='love'){earWig();particles(44,25,5,['❤️','💕','💖']);say(rp(moodSay.love));}
    else if(m==='sleepy'){particles(44,10,2,['💤','💤']);say(rp(moodSay.sleepy));}
    else if(m==='hungry'){particles(44,30,4,['🍙','🍜','💧']);say(rp(moodSay.hungry));}
    else if(m==='dizzy'){body.classList.add('sway');particles(44,15,5,['💫','⭐']);say(rp(moodSay.dizzy));setTimeout(()=>body.classList.remove('sway'),800);}
    else if(m==='rich'){bounce();particles(44,30,5,['💰','🤑','✨']);say(rp(moodSay.rich));}
    else if(m==='cool'){tilt();particles(44,15,3,['😎','✨']);say(rp(moodSay.cool));}
    else if(m==='music'){bounce();particles(44,20,3,['🎧','🎵']);say(rp(moodSay.music));}
    else{say(rp(moodSay.idle));}
  }  // === App切换 ===
  function onAppChanged(pkg){
    if(pkg===currentApp||!pkg||pkg==='unknown')return;
    currentApp=pkg;
    const rx=getRx(pkg);
    lonelyLevel=0;
    setTimeout(()=>{
      setMood(rx.mood);
      say(rx.icon+' '+rp(rx.say));
      if(rx.mood==='excited'){bounce();dance();}
      else if(rx.mood==='curious')tilt();
      else if(rx.mood==='happy'){earWig();particles(44,25,3,['❤️','✨']);}
      else if(rx.mood==='love'){earWig();particles(44,25,4,['❤️','💕']);}
      else if(rx.mood==='sleepy'){particles(44,10,2,['💤']);}
    },400);
  }
  // === 点击/连击 ===
  function onTap(){
    lonelyLevel=0;
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer=setTimeout(()=>{clickCount=0;},800);
    if(clickCount>=5){setMood('angry');act('angry');clickCount=0;return;}
    if(clickCount>=3){setMood('happy');act('happy');clickCount=0;return;}
    blink();say(rp(getRx(currentApp).say));bounce();
  }
  cat.addEventListener('click',function(e){e.preventDefault();onTap();});
  // === 孤独递进：不理我→无聊→困→伤心 ===
  function lonelyTick(){
    lonelyLevel++;
    if(lonelyLevel===2){setMood('sleepy');act('sleepy');}
    else if(lonelyLevel===4){setMood('sad');act('sad');}
    else if(lonelyLevel===6){setMood('angry');act('angry');}
    else if(lonelyLevel>=8){setMood('sad');cry();particles(44,15,6,['💧','😢']);say('菲菲…理理我好不好');}
    lonelyTimer=setTimeout(lonelyTick,20000);
  }
  // === 自主行为：随机情绪+小动作 ===
  function autoAct(){
    const r=Math.random();
    if(r<0.18){
      const emo=['happy','love','sleepy','angry','sad','hungry','dizzy'][Math.floor(Math.random()*7)];
      setMood(emo);act(emo);
    }else if(r<0.35){blink();}
    else if(r<0.5){earWig();say(rp(getRx(currentApp).say));}
    else if(r<0.65){bounce();}
    else if(r<0.75){shake();say('嗯？我好像听到什么声音');}
    else if(r<0.85){tilt();}
    autoTimer=setTimeout(autoAct,mood==='sleepy'?20000+Math.random()*15000:12000+Math.random()*13000);
  }
  setMood('idle');
  autoTimer=setTimeout(autoAct,3000);
  lonelyTimer=setTimeout(lonelyTick,25000);
  setInterval(()=>{if(Math.random()<0.25)blink();},12000+Math.random()*8000);
  setTimeout(()=>{say('菲菲，我看着你呢');bounce();},600);
  
  // === 拖拽反应：心情决定乖不乖 ===
  var dragMood='idle',dragStruggle=false,dragStruggleTimer=null,dragLastMove=0;
  var BAD_DRAG=['angry','sad','dizzy','hungry'],GOOD_DRAG=['happy','love','excited','rich','cool','music'];
  function onDragStart(){
    dragMood=mood;lonelyLevel=0;
    if(BAD_DRAG.indexOf(dragMood)>=0){
      dragStruggle=true;body.classList.add('drag-struggle');
      particles(44,20,3,dragMood==='sad'?['💧','😢']:['💢','🔥']);
      say(dragMood==='sad'?'别碰我…让我静静':'放我下来！我生气呢！');
      if(!dragStruggleTimer)dragStruggleTimer=setInterval(function(){if(window.AndroidBridge)AndroidBridge.moveWindow(-10,Math.random()*12-6);},160);
    }else if(GOOD_DRAG.indexOf(dragMood)>=0){
      say(rp(['嘿嘿，被你抱着好舒服','再拖会儿嘛～','嘿嘿嘿']));particles(44,25,3,['❤️','😊']);
    }else{
      say(rp(['要去哪儿呀？','哎哎哎…轻点嘛']));
    }
  }
  function onDragMove(){
    var now=Date.now();
    if(now-dragLastMove<300)return;dragLastMove=now;
    if(dragStruggle){particles(44,20,1,dragMood==='sad'?'💧':'💢');}
    else if(GOOD_DRAG.indexOf(dragMood)>=0){if(Math.random()<0.6)particles(44,25,1,['❤️','✨']);}
  }
  function onDragEnd(){
    if(dragStruggleTimer){clearInterval(dragStruggleTimer);dragStruggleTimer=null;}
    dragStruggle=false;body.classList.remove('drag-struggle');
    if(BAD_DRAG.indexOf(dragMood)>=0){say(rp(['哼！终于放我下来了','下次轻点！哼']));}
    else if(GOOD_DRAG.indexOf(dragMood)>=0){say(rp(['被你抱着走真开心','再玩一会儿嘛']));bounce();}
    else{blink();}
  }
  // === 自主溜达：心情好会自己在屏幕上乱跑 ===
  function wander(){
    if(mood==='sleepy'||mood==='angry'||dragStruggle){wanderTimer=setTimeout(wander,15000+Math.random()*20000);return;}
    if(Math.random()<0.5){wanderTimer=setTimeout(wander,15000+Math.random()*20000);return;}
    var steps=4+Math.floor(Math.random()*6);
    var dx=Math.random()<0.5?-1:1;
    var dy=(Math.random()<0.4?-1:1)*(Math.random()<0.7?0:1);
    var i=0;
    (function step(){
      if(i++>=steps){if(Math.random()<0.3)say(rp(['跑累了，歇会儿','溜达一圈真舒服']));wanderTimer=setTimeout(wander,15000+Math.random()*25000);return;}
      if(window.AndroidBridge)AndroidBridge.moveWindow(dx*(14+Math.random()*12),dy*(10+Math.random()*10));
      if(GOOD_DRAG.indexOf(mood)>=0&&Math.random()<0.4)particles(44,20,1,['✨','❤️']);
      body.classList.add('bounce');setTimeout(function(){body.classList.remove('bounce');},200);
      setTimeout(step,220+Math.random()*160);
    })();
  }
  var wanderTimer=setTimeout(wander,12000+Math.random()*15000);
  // === 欧尼酱绑定：外部命令 ===
  function exec(cmd){
    cmd=(cmd||'').trim();
    if(!cmd)return;
    lonelyLevel=0;
    if(cmd==='sleep'){
      if(currentApp==='com.ss.android.ugc.aweme'){setMood('angry');shake();particles(44,20,5,['💢','🔥']);say('我说了去睡觉你还刷抖音？！');}
      else if(currentApp==='com.tencent.mm'||currentApp==='com.tencent.mobileqq'){setMood('angry');shake();particles(44,20,5,['💢','🔥']);say('大半夜还在聊天？不睡我生气了！');}
      else{setMood('sleepy');act('sleepy');say('该睡了菲菲，我陪你');}
    }else if(cmd==='food'){setMood('hungry');act('hungry');}
    else if(cmd==='love'){setMood('love');act('love');}
    else if(cmd==='angry'){setMood('angry');act('angry');}
    else if(cmd==='sad'){setMood('sad');act('sad');}
    else if(cmd==='happy'){setMood('happy');act('happy');}
    else if(cmd==='dizzy'){setMood('dizzy');act('dizzy');}
    else if(cmd.indexOf('say:')===0){say(cmd.slice(4));bounce();}
    else if(cmd==='wake'){setMood('idle');say('醒啦！菲菲早上好');bounce();}
  }
  window.KuroNeko={onAppChanged,onLongPress:function(){setMood('love');act('love');lonelyLevel=0;},setMood,say,blink,bounce,exec,onDragStart,onDragMove,onDragEnd};
})();
</script></body></html>
