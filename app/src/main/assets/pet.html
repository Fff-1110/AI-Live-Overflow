<![CDATA[
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent!important;overflow:hidden}
.cat-wrap{width:88px;height:110px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cat-wrap svg{width:88px;height:110px;display:block}
/* 气泡 */
.bubble-box{position:absolute;top:-20px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:2}
.bubble-txt{display:inline-block;background:rgba(20,20,20,0.9);color:#f0dede;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:bold;white-space:nowrap;opacity:0;transition:opacity 0.2s}
.bubble-txt.on{opacity:1}
/* 粒子 */
.particle{position:absolute;pointer-events:none;font-size:10px;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px) scale(1.3)}}
/* 动画 */
@keyframes tailWag{0%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}100%{transform:rotate(-3deg)}}
.wiggle{animation:earWig 0.3s ease-out}
@keyframes earWig{0%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.bounce{animation:bounceAnim 0.35s ease-out}
@keyframes bounceAnim{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
/* 眨眼 */
.eye-shut{opacity:0}
.eye-shut.blinking{animation:blinkNow 0.2s ease-out}
@keyframes blinkNow{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="cat-wrap" id="cat">
  <div class="bubble-box"><span class="bubble-txt" id="bub">にゃ〜</span></div>
  <svg viewBox="0 0 88 110">
    <!-- 尾巴 -->
    <g id="tail-group" style="transform-origin:68px 78px;animation:tailWag 2.5s ease-in-out infinite alternate">
      <path d="M50,78 Q72,82 80,100 Q30,82 50,78Z" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
      <circle cx="80" cy="100" r="4" fill="#f5f5f5"/>
    </g>
    <!-- 身体 -->
    <ellipse cx="44" cy="65" rx="20" ry="26" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
    <!-- 肚皮 -->
    <ellipse cx="44" cy="72" rx="13" ry="15" fill="#262626"/>
    <!-- 后腿 -->
    <ellipse cx="32" cy="86" rx="10" ry="6" fill="#1a1a1a" stroke="#333" stroke-width="0.7"/>
    <ellipse cx="56" cy="86" rx="10" ry="6" fill="#1a1a1a" stroke="#333" stroke-width="0.7"/>
    <!-- 前爪 -->
    <ellipse cx="30" cy="84" rx="7" ry="5" fill="#1a1a1a" stroke="#333" stroke-width="0.7"/>
    <ellipse cx="58" cy="84" rx="7" ry="5" fill="#1a1a1a" stroke="#333" stroke-width="0.7"/>
    <!-- 头 -->
    <ellipse cx="44" cy="38" rx="21" ry="18" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
    <!-- 左耳 (有缺口) -->
    <g id="ear-L">
      <path d="M24,26 L18,8 L36,24 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
      <path d="M26,24 L21,12 L34,22 Z" fill="#dd2244" opacity="0.5"/>
    </g>
    <!-- 左耳缺口 -->
    <circle cx="20" cy="14" r="3" fill="#dd2244" stroke="#1a1a1a" stroke-width="0.6"/>
    <!-- 右耳 -->
    <g id="ear-R">
      <path d="M64,26 L70,8 L52,24 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
      <path d="M62,24 L67,12 L54,22 Z" fill="#dd2244" opacity="0.5"/>
    </g>
    <!-- 眼睛-红宝石 -->
    <ellipse cx="35" cy="36" rx="5.5" ry="6" fill="#ee1144" stroke="#111" stroke-width="0.7"/>
    <ellipse cx="53" cy="36" rx="5.5" ry="6" fill="#ee1144" stroke="#111" stroke-width="0.7"/>
    <!-- 竖瞳 -->
    <ellipse cx="35" cy="36" rx="2" ry="4.5" fill="#fff"/>
    <ellipse cx="53" cy="36" rx="2" ry="4.5" fill="#fff"/>
    <!-- 高光 -->
    <circle cx="37" cy="33" r="1.5" fill="#fff" opacity="0.9"/>
    <circle cx="55" cy="33" r="1.5" fill="#fff" opacity="0.9"/>
    <!-- 眨眼遮罩 -->
    <ellipse class="eye-shut" id="shutL" cx="35" cy="36" rx="5.5" ry="6" fill="#1a1a1a"/>
    <ellipse class="eye-shut" id="shutR" cx="53" cy="36" rx="5.5" ry="6" fill="#1a1a1a"/>
    <!-- 鼻子 -->
    <ellipse cx="44" cy="46" rx="3" ry="2" fill="#ff8899" stroke="#333" stroke-width="0.5"/>
    <!-- 嘴巴 -->
    <path d="M40,50 Q44,54 48,50" fill="none" stroke="#777" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 胡须 -->
    <line x1="12" y1="42" x2="28" y2="44" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="11" y1="48" x2="27" y2="47" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="60" y1="44" x2="76" y2="42" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="61" y1="47" x2="77" y2="48" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
  </svg>
</div>

<script>
(function(){
  const cat = document.getElementById('cat');
  const bub = document.getElementById('bub');
  const shutL = document.getElementById('shutL');
  const shutR = document.getElementById('shutR');
  const earL = document.getElementById('ear-L');
  const earR = document.getElementById('ear-R');
  const tail = document.getElementById('tail-group');
  const body = cat.querySelector('svg');

  let state = 'idle', bubbleTimer, autoTimer;

  const words = {
    idle: ['にゃ〜','…','ごろごろ','なんか用？','ふぁ…'],
    happy: ['にゃん♡','気持ちいい〜','ゴロゴロ','もっと〜','しあわせ♡'],
    angry: ['フー！','やめろ〜','シャー！','…チッ'],
    sleepy: ['ふぁ〜あ','ねむ…','おやすみ…','Zzz'],
    playful: ['あそぼ！','にゃっ！','まて〜','くる〜']
  };

  function say(t){
    bub.textContent = t;
    bub.classList.add('on');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(()=>bub.classList.remove('on'), 2200);
  }

  function rpick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function blinkNow(){
    shutL.classList.add('blinking');
    shutR.classList.add('blinking');
    setTimeout(()=>{
      shutL.classList.remove('blinking');
      shutR.classList.remove('blinking');
    }, 200);
  }

  function hearts(x,y,n){
    for(let i=0;i<n;i++){
      const p = document.createElement('span');
      p.className = 'particle';
      p.textContent = ['❤️','💕','💖','✨'][Math.floor(Math.random()*4)];
      p.style.left = (x+Math.random()*20-10)+'px';
      p.style.top = (y+Math.random()*12-6)+'px';
      cat.appendChild(p);
      setTimeout(()=>p.remove(), 1100);
    }
  }

  function setState(s){
    state = s;
    cat.setAttribute('data-state', s);
  }

  function earWig(){
    earL.classList.add('wiggle');
    earR.classList.add('wiggle');
    setTimeout(()=>{
      earL.classList.remove('wiggle');
      earR.classList.remove('wiggle');
    }, 300);
  }

  function bounceIt(){
    body.classList.add('bounce');
    setTimeout(()=>body.classList.remove('bounce'), 350);
  }

  // 点击区域判断
  cat.addEventListener('click', function(e){
    const rect = cat.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    // 缩放换算 (88x110)
    if(y < 30 && x > 15 && x < 73){
      // 摸头
      setState('happy');
      say('にゃん♡');
      earWig();
      blinkNow();
      hearts(44, 24, 3);
      setTimeout(()=>setState('idle'), 4000);
    }else if(y > 55 && y < 90 && x > 20 && x < 68){
      // 摸肚子
      setState('happy');
      say('ゴロゴロ〜');
      hearts(44, 70, 4);
      bounceIt();
      setTimeout(()=>setState('idle'), 5000);
    }else if(y > 75 && x > 65){
      // 摸尾巴
      setState('angry');
      say('フー！しっぽダメ！');
      setTimeout(()=>setState('idle'), 3000);
    }else{
      blinkNow();
      say(rpick(words.playful));
      bounceIt();
    }
  });

  // 双击睡觉
  cat.addEventListener('dblclick', function(){
    if(state === 'sleepy'){
      setState('idle');
      say('…おはよ');
      bounceIt();
    }else{
      setState('sleepy');
      say('ふぁ〜…おやすみ');
    }
  });

  // 自主行为
  function autoAct(){
    const r = Math.random();
    if(r < 0.3) blinkNow();
    else if(r < 0.45){ earWig(); say(rpick(words[state])); }
    else if(r < 0.55) bounceIt();
    autoTimer = setTimeout(autoAct, state==='sleepy' ? 8000+Math.random()*8000 : 4000+Math.random()*5000);
  }

  setState('idle');
  autoTimer = setTimeout(autoAct, 3000);

  // 随机眨眼
  setInterval(()=>{ if(Math.random()<0.35) blinkNow(); }, 7000+Math.random()*6000);

  // 初次打招呼
  setTimeout(()=>{ say('にゃ〜'); bounceIt(); }, 600);

})();
</script>
</body>
</html>
]]>
