<style>
*:body{background:transparent!important;margin:0;overflow:hidden;font-family:sans-serif;color:#fff}
.pet{width:180px;height:240px;position:relative;cursor:pointer}
#tail{transform-origin:150px 190px;animation:tailSway 2s ease-in-out infinite alternate}
#body{fill:#1a1a2e;stroke:#333;stroke-width:1.5}
#leftEar{fill:#1a1a2e;stroke:#333;stroke-width:1.5}
#rightEar{fill:#1a1a2e;stroke:#333;stroke-width:1.5}

#rightEarInner{fill:#ff3355;opacity:0.6}
#leftEye{rx="52";cy="75";stroke:#ff3355;stroke-width:2;fill:none}
#rightEye{rx="99";cy="75";stroke:#ff3355;stroke-width:2;fill:none}
#leftPupil{fill:#fff;rx="54";cy="75"}
#rightPupil{fill:#fff;rx="97";cy="75"}
#nose{fill:#ffc3d0;stroke:#333;stroke-width:1}
#whiskers{stroke:#ccc;stroke-width:1.5;fill:none;stroke-linecap:round}
#earNick{fill:#1a1a2e;stroke:#ff3355;stroke-width:1.5}
#tailTip{fill:#fff;opacity:0.9}
#heart{fill:#ff3355;opacity:0;animation:heartBeat 1.5s ease-in-out infinite}
"bubble{fill:#fff;opacity:0;font-size:11px;font-weight:bold}
#bubbleBg{fill:#333;opacity:0}
.speech{position:absolute;top:0;left:0;background:rgba(33,33,33,0.92);color:#fff;padding:6px 12px;border-radius:16px;font-size:12px;max-width:160px;transform:translate(-100%, -100%);opacity:0;transition:opacity 0.3s}
.speech.show{opacity:1}
@keyframes tailSway{0%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}100%{transform:rotate(-3deg)}}
@keyframes heartBeat{0%{opacity:0;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(0.8)}}
.blink{opacity:0;animation:blink 0.2s ease-in-out;animation-fill-mode:forwards}
@keyframes blink{0%{</style>
<script>
const SUPABASE_URL='https://ebmzkftreptofjmdsiam.supabase.co';
const SUPABASE_KEY='sb_publishable_dSqyFMLb3Ih4Sf99atKG5Q_Z9_rWm85';
window.petEngine={state:'idle',speakTimer:-1,onFace:function(st){this.setState(st)},setState:function(s){this.state=s;document.body.setAttribute('data-state',s)},onFavorite:function(){this.showHeart()},onSpeak:function(txt){this.showBubble(txt)},showHeart:function(){document.getElementById('heart').style.animation='none';setTimeout(()=>{document.getElementById('heart').style.animation='heartBeat 1.5s ease-in-out infinite'},0)},showBubble:function(t){const b=document.getElementById('bubble'),bg=document.getElementById('bubbleBg');b.textContent=t;b.style.opacity='1';bg.style.opacity='1';clearTimeout(this.speakTimer);this.speakTimer=setTimeout(()=>{b.style.opacity='0';bg.style.opacity='0'},3000)},onTap:function(){this.showBubble('\uD83C\uD8030');const eyes=document.querySelectorAll('.blink');eyes.forEach(e=>{e.style.opacity='0';e.style.animation='none';setTimeout(()=>{e.style.opacity='';e.style.animation='blink 0.2s ease-in-out'},100)})},pollState:function(){fetch(`${SUPABASE_URL}/rest/v1/pet_state?order=updated_at.desc&limit=1`,{headers:{'apikey':SUPABASE_KEY}}).then(r=>r.json()).then(d=>{if(d[0]){this.onFace(d[0].state_value)}}).catch(_=>{})}};
setInterval(()=>{window.petEngine.pollState()},30000);
