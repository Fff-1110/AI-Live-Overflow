<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent!important;overflow:hidden}
.cat-wrap{width:88px;height:144px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;transform-origin:44px 100px}
.cat-wrap svg{width:88px;height:118px;display:block;margin-top:26px;transform-origin:44px 60px}
.bubble-box{position:absolute;top:0;left:0;width:88px;pointer-events:none;z-index:2;display:flex;justify-content:center}
.bubble-txt{display:block;background:rgba(18,18,18,0.92);color:#f0dede;padding:3px 6px;border-radius:8px;font-size:10px;font-weight:bold;opacity:0;transition:opacity 0.2s;max-width:84px;white-space:normal;word-break:break-all;line-height:1.35;text-align:center}
.bubble-txt.on{opacity:1}
.particle{position:absolute;pointer-events:none;font-size:10px;animation:floatUp 1.2s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-42px) scale(1.3)}}
@keyframes tailWag{0%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}100%{transform:rotate(-3deg)}}
@keyframes tailDrop{0%{transform:rotate(0)}100%{transform:rotate(14deg)}}
.wiggle{animation:earWig 0.3s ease-out}
@keyframes earWig{0%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.bounce{animation:bounceAnim 0.35s ease-out}
@keyframes bounceAnim{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.dance{animation:danceAnim 0.6s ease-in-out}
@keyframes danceAnim{0%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.tilt{animation:tiltAnim 0.3s ease-out}
@keyframes tiltAnim{0%{transform:rotate(0)}40%{transform:rotate(-10deg)}100%{transform:rotate(0)}}
.shake{animation:shakeAnim 0.5s ease-in-out}
@keyframes shakeAnim{0%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}100%{transform:translateX(0)}}
.cry{animation:cryAnim 0.8s ease-in-out}
@keyframes cryAnim{0%{transform:translateY(0)}30%{transform:translateY(-3px)}60%{transform:translateY(2px)}100%{transform:translateY(0)}}
.sulk{animation:sulkAnim 0.6s ease-in-out}
@keyframes sulkAnim{0%{transform:rotate(0) translateX(0)}30%{transform:rotate(3deg) translateX(3px)}60%{transform:rotate(-3deg) translateX(-3px)}100%{transform:rotate(0) translateX(0)}}
.eye-shut{opacity:0}
.eye-shut.blinking{animation:blinkNow 0.2s ease-out}
@keyframes blinkNow{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
.mood-blush{opacity:0;transition:opacity 0.5s}
.cat-wrap[data-mood="happy"] .mood-blush,.cat-wrap[data-mood="excited"] .mood-blush,.cat-wrap[data-mood="love"] .mood-blush{opacity:0.6}
/* 眼睛表情组 */
#eyes-angry,#eyes-sad,#eyes-happy,#eyes-sleepy{display:none}
.cat-wrap[data-mood="angry"] #eyes-normal{display:none}
.cat-wrap[data-mood="angry"] #eyes-angry{display:block}
.cat-wrap[data-mood="sad"] #eyes-normal{display:none}
.cat-wrap[data-mood="sad"] #eyes-sad{display:block}
.cat-wrap[data-mood="happy"] #eyes-normal{display:none}
.cat-wrap[data-mood="happy"] #eyes-happy{display:block}
.cat-wrap[data-mood="excited"] #eyes-normal{display:none}
.cat-wrap[data-mood="excited"] #eyes-happy{display:block}
.cat-wrap.love-flash #eyes-normal{display:none}
.cat-wrap.love-flash #eyes-happy{display:none}
.cat-wrap.love-flash #eyes-love{display:block}
.cat-wrap.love-flash #drool{display:block;animation:droolAnim 0.9s ease-in infinite}
@keyframes droolAnim{0%{transform:translateY(0);opacity:0.95}70%{transform:translateY(4px);opacity:0.75}100%{transform:translateY(8px);opacity:0}}
/* 星星眼 */
.cat-wrap[data-mood="star"] #eyes-normal{display:none}
.cat-wrap[data-mood="star"] #eyes-star{display:block}
.cat-wrap[data-mood="star"] .mood-blush{opacity:0.6}
/* 暴怒 */
.cat-wrap[data-mood="fury"] #eyes-normal{display:none}
.cat-wrap[data-mood="fury"] #eyes-fury{display:block}
.cat-wrap[data-mood="fury"] #ear-L{transform:rotate(-20deg)}
.cat-wrap[data-mood="fury"] #ear-R{transform:rotate(20deg)}
.fury-shake{animation:furyShake 0.15s infinite}
@keyframes furyShake{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px) rotate(-2deg)}50%{transform:translate(3px,-2px) rotate(2deg)}75%{transform:translate(-2px,-3px)}100%{transform:translate(0,0)}}
/* 邪肆 */
.cat-wrap[data-mood="wicked"] #eyes-normal{display:none}
.cat-wrap[data-mood="wicked"] #eyes-wicked{display:block}
/* 五官乱飞 */
.facefling #eyes-normal ellipse:nth-child(1){animation:eyeFlyL 0.8s ease}
.facefling #eyes-normal ellipse:nth-child(2){animation:eyeFlyR 0.8s ease}
.facefling #mouth{animation:mouthFly 0.8s ease}
@keyframes eyeFlyL{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-18px,-14px) rotate(-60deg)}55%{transform:translate(-7px,10px) rotate(25deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes eyeFlyR{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(20px,-16px) rotate(60deg)}55%{transform:translate(9px,12px) rotate(-25deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes mouthFly{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,12px) rotate(35deg)}55%{transform:translate(4px,-10px) rotate(-25deg)}100%{transform:translate(0,0) rotate(0)}}
.cat-wrap[data-mood="sleepy"] #eyes-normal{display:none}
.cat-wrap[data-mood="sleepy"] #eyes-sleepy{display:block}
/* 耳朵：生气竖起、伤心耷拉 */
#ear-L,#ear-R{transform-origin:center bottom}
.cat-wrap[data-mood="angry"] #ear-L{transform:rotate(-14deg)}
.cat-wrap[data-mood="angry"] #ear-R{transform:rotate(14deg)}
.cat-wrap[data-mood="sad"] #ear-L{transform:rotate(22deg)}
.cat-wrap[data-mood="sad"] #ear-R{transform:rotate(-22deg)}
/* 尾巴：伤心垂下 */
#tail-group{animation:tailWag 6s ease-in-out infinite alternate;transform-origin:68px 80px}
.cat-wrap[data-mood="sad"] #tail-group{animation:tailDrop 0.8s ease-out forwards}
/* 嘴巴底色 */
#mouth{transition:d 0.2s}
/* 装饰：金链/墨镜/耳机/口水 */
#necklace,#sunglasses,#headphones,#drool{display:none}
.cat-wrap[data-mood="rich"] #necklace{display:block}
.cat-wrap[data-mood="cool"] #sunglasses{display:block}
.cat-wrap[data-mood="music"] #headphones{display:block}
.cat-wrap[data-mood="hungry"] #drool{display:block}
#eyes-dizzy,#eyes-hungry{display:none}
.cat-wrap[data-mood="dizzy"] #eyes-normal{display:none}
.cat-wrap[data-mood="dizzy"] #eyes-dizzy{display:block}
.cat-wrap[data-mood="hungry"] #eyes-normal{display:none}
.cat-wrap[data-mood="hungry"] #eyes-hungry{display:block}
.cat-wrap[data-mood="rich"] #eyes-normal{display:none}
.cat-wrap[data-mood="rich"] #eyes-happy{display:block}
.cat-wrap[data-mood="music"] #eyes-normal{display:none}
.cat-wrap[data-mood="music"] #eyes-happy{display:block}
.cat-wrap[data-mood="cool"] #eyes-normal{display:block}
.cat-wrap[data-mood="rich"] .mood-blush,.cat-wrap[data-mood="music"] .mood-blush{opacity:0.6}
.sway{animation:swayAnim 0.7s ease-in-out}
@keyframes swayAnim{0%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-5deg)}100%{transform:rotate(0)}}

/* 拖拽挣扎：不高兴被拖着走时会挣扎 */
.drag-struggle{animation:dragstruggle 0.16s infinite}
@keyframes dragstruggle{0%{transform:rotate(-7deg) translateX(-4px)}50%{transform:rotate(7deg) translateX(4px)}100%{transform:rotate(-7deg) translateX(-4px)}}

/* 新小动作 */
.sneeze{animation:sneeze 0.5s}
@keyframes sneeze{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-6px) rotate(-8deg)}50%{transform:translateY(-2px) rotate(6deg)}70%{transform:translateY(-5px) rotate(-6deg)}100%{transform:translateY(0)}}
.stretch{animation:stretch 0.9s}
@keyframes stretch{0%{transform:scaleY(1) scaleX(1)}35%{transform:scaleY(1.6) scaleX(0.7) translateY(-10px)}70%{transform:scaleY(1.55) scaleX(0.72) translateY(-9px)}100%{transform:scaleY(1) scaleX(1)}}
.tailchase{animation:tailchase 0.8s}
@keyframes tailchase{0%{transform:rotate(0)}25%{transform:rotate(-15deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-10deg)}100%{transform:rotate(0)}}
/* 音乐模式：尾巴摇飞+身体摇摆 */
@keyframes tailSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes musicDance{0%{transform:translateY(0) rotate(-2deg)}25%{transform:translateY(-4px) rotate(2deg)}50%{transform:translateY(0) rotate(-2deg)}75%{transform:translateY(-4px) rotate(2deg)}100%{transform:translateY(0)}}
#cat.music-on #tail-group{animation:tailSpin 0.4s linear infinite}
#cat.music-hot #tail-group{animation:tailSpin 0.13s linear infinite}
#cat.music-on #catsvg{animation:musicDance 0.5s ease-in-out infinite}

/* 躺平/上蹿下跳/喘气 */
.lying{transform:rotate(90deg) translateY(6px)}
.jumparound{animation:jumparound 0.38s infinite}
@keyframes jumparound{0%{transform:translateY(0) rotate(0)}15%{transform:translateY(-58px) rotate(-7deg)}35%{transform:translateY(0) rotate(5deg) translateX(7px)}50%{transform:translateY(-58px) rotate(-5deg) translateX(-4px)}70%{transform:translateY(0) rotate(6deg) translateX(3px)}85%{transform:translateY(-58px) rotate(-7deg) translateX(-6px)}100%{transform:translateY(0) rotate(0)}}
.pant{animation:pant 0.55s infinite}
@keyframes pant{0%{transform:scale(1,1)}50%{transform:scale(1.05,0.95)}100%{transform:scale(1,1)}}
</style></head><body>

      if(currentApp==='com.ss.android.ugc.aweme'){setMood('angry');shake();particles(44,20,5,['💢','🔥']);say('我说了去睡觉你还刷抖音？！');}
      else if(currentApp==='com.tencent.mm'||currentApp==='com.tencent.mobileqq'){setMood('angry');shake();particles(44,20,5,['💢','🔥']);say('大半夜还在聊天？不睡我生气了！');}
      else{setMood('sleepy');lieDown();say('该睡了菲菲，我陪你');}
    }else if(cmd.indexOf('food')===0){var ff=cmd.indexOf(':')>=0?cmd.split(':')[1]:'';feed(ff);}
    else if(cmd.indexOf('music')===0){var mp=cmd.indexOf(':')>=0?cmd.split(':')[1]:'on';onMusicChange(mp!=='off',mp==='hot');}
    else if(cmd==='love'){setMood('love');act('love');}
    else if(cmd==='angry'){setMood('angry');act('angry');}
    else if(cmd==='sad'){setMood('sad');act('sad');}
    else if(cmd==='happy'){setMood('happy');act('happy');}
    else if(cmd==='dizzy'){setMood('dizzy');act('dizzy');}
    else if(cmd.indexOf('say:')===0){say(cmd.slice(4));bounce();}
    else if(cmd==='wake'){setMood('idle');say('醒啦！菲菲早上好');bounce();}
  }
  window.KuroNeko={onAppChanged,onLongPress:function(){setMood('love');act('love');lonelyLevel=0;},setMood,say,blink,bounce,exec,onDragStart,onDragMove,onDragEnd,onDouyinAction,onVideoSwitch,onFling,onMusicChange};
})();
</script></body></html>
