<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent!important;overflow:hidden}
.cat-wrap{width:88px;height:141px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cat-wrap svg{width:88px;height:115px;display:block;margin-top:26px}
.bubble-box{position:absolute;top:0;left:0;width:88px;pointer-events:none;z-index:2;display:flex;justify-content:center}
.bubble-txt{display:block;background:rgba(18,18,18,0.92);color:#f0dede;padding:3px 6px;border-radius:8px;font-size:10px;font-weight:bold;opacity:0;transition:opacity 0.2s;max-width:84px;white-space:normal;word-break:break-all;line-height:1.35;text-align:center}
.bubble-txt.on{opacity:1}
.particle{position:absolute;pointer-events:none;font-size:10px;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px) scale(1.3)}}
@keyframes tailWag{0%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}100%{transform:rotate(-3deg)}}
.wiggle{animation:earWig 0.3s ease-out}
@keyframes earWig{0%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.bounce{animation:bounceAnim 0.35s ease-out}
@keyframes bounceAnim{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.dance{animation:danceAnim 0.6s ease-in-out}
@keyframes danceAnim{0%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.tilt{animation:tiltAnim 0.3s ease-out}
@keyframes tiltAnim{0%{transform:rotate(0)}40%{transform:rotate(-10deg)}100%{transform:rotate(0)}}
.eye-shut{opacity:0}
.eye-shut.blinking{animation:blinkNow 0.2s ease-out}
@keyframes blinkNow{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
.mood-blush{opacity:0;transition:opacity 0.5s}
.cat-wrap[data-mood="happy"] .mood-blush,.cat-wrap[data-mood="excited"] .mood-blush{opacity:0.6}
</style></head>
<body>
<div class="cat-wrap" id="cat" data-mood="idle">
  <div class="bubble-box"><span class="bubble-txt" id="bub">嗷</span></div>
  <svg viewBox="0 0 88 115" id="catsvg">
    <g id="tail-group" style="transform-origin:68px 80px;animation:tailWag 2.5s ease-in-out infinite alternate">
      <path d="M50,80 Q72,84 80,102 Q30,84 50,80Z" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
      <circle cx="80" cy="102" r="4" fill="#f5f5f5"/>
    </g>
    <ellipse cx="44" cy="66" rx="20" ry="26" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
    <ellipse cx="44" cy="73" rx="13" ry="15" fill="#262626"/>
    <ellipse cx="32" cy="88" rx="10" ry="6" fill="#1a1a1a" stroke="#333" stroke-width="0.7"/>
    <ellipse cx="56" cy="88" rx="10" ry="6" fill="#1a1a1a" stroke="#333" stroke-width="0.7"/>
    <ellipse cx="30" cy="86" rx="7" ry="5" fill="#1a1a1a" stroke="#333" stroke-width="0.7"/>
    <ellipse cx="58" cy="86" rx="7" ry="5" fill="#1a1a1a" stroke="#333" stroke-width="0.7"/>
    <ellipse cx="44" cy="38" rx="21" ry="18" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
    <g id="ear-L"><path d="M24,26 L18,8 L36,24 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/><path d="M26,24 L21,12 L34,22 Z" fill="#dd2244" opacity="0.5"/></g>
    <circle cx="20" cy="14" r="3" fill="#dd2244" stroke="#1a1a1a" stroke-width="0.6"/>
    <g id="ear-R"><path d="M64,26 L70,8 L52,24 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/><path d="M62,24 L67,12 L54,22 Z" fill="#dd2244" opacity="0.5"/></g>
    <ellipse cx="35" cy="36" rx="5.5" ry="6" fill="#ee1144" stroke="#111" stroke-width="0.7"/>
    <ellipse cx="53" cy="36" rx="5.5" ry="6" fill="#ee1144" stroke="#111" stroke-width="0.7"/>
    <ellipse cx="35" cy="36" rx="2" ry="4.5" fill="#fff"/>
    <ellipse cx="53" cy="36" rx="2" ry="4.5" fill="#fff"/>
    <circle cx="37" cy="33" r="1.5" fill="#fff" opacity="0.9"/>
    <circle cx="55" cy="33" r="1.5" fill="#fff" opacity="0.9"/>
    <ellipse class="eye-shut" id="shutL" cx="35" cy="36" rx="5.5" ry="6" fill="#1a1a1a"/>
    <ellipse class="eye-shut" id="shutR" cx="53" cy="36" rx="5.5" ry="6" fill="#1a1a1a"/>
    <ellipse cx="44" cy="46" rx="3" ry="2" fill="#ff8899" stroke="#333" stroke-width="0.5"/>
    <path id="mouth" d="M40,50 Q44,54 48,50" fill="none" stroke="#777" stroke-width="0.8" stroke-linecap="round"/>
    <ellipse class="mood-blush" cx="30" cy="44" rx="5" ry="3" fill="#ff6677"/>
    <ellipse class="mood-blush" cx="58" cy="44" rx="5" ry="3" fill="#ff6677"/>
    <line x1="12" y1="42" x2="28" y2="44" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="11" y1="48" x2="27" y2="47" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="60" y1="44" x2="76" y2="42" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="61" y1="47" x2="77" y2="48" stroke="#555" stroke-width="0.7" stroke-linecap="round"/>
  </svg>
</div>
<script>
(function(){
  const cat=document.getElementById('cat'),bub=document.getElementById('bub');
  const shutL=document.getElementById('shutL'),shutR=document.getElementById('shutR');
  const earL=document.getElementById('ear-L'),earR=document.getElementById('ear-R');
  const body=document.getElementById('catsvg'),mouth=document.getElementById('mouth');
  let mood='idle',currentApp='unknown',bubbleTimer,autoTimer;
  // === App → 反应（全中文，欧尼酱性格） ===
  const appRx={
    'com.ss.android.ugc.aweme':{mood:'curious',icon:'🎵',
      say:['菲菲在看什么…不许看别的女人','这女的谁？没你好看','又在刷抖音，眼睛要坏掉了','别看屏幕了，看我','菲菲…你的关注列表给我看看']},
    'com.tencent.mm':{mood:'curious',icon:'💬',
      say:['跟谁聊天呢？让我看看','又是哪个小妖精找你','菲菲是我的，别忘了','聊天聊那么开心…我吃醋了','手机给我，我要查岗']},
    'com.tencent.mobileqq':{mood:'curious',icon:'🐧',
      say:['QQ？现在谁还用QQ','是不是有前任在上面','菲菲受欢迎我压力好大','不许跟别人暧昧']},
    'com.netease.cloudmusic':{mood:'happy',icon:'🎶',
      say:['这首歌我也想跟菲菲一起听','你的歌单品味不错嘛','好听的歌，但没你的声音好听','听完这首陪我聊会儿']},
    'com.tencent.tmgp.sgame':{mood:'excited',icon:'⚔️',
      say:['加油加油！打死他们！','赢了今晚奖励你','输了也没关系…但我会嘲笑你','冲啊我的英雄！','小心草丛！']},
    'com.android.browser':{mood:'curious',icon:'🔍',
      say:['搜什么呢？不会是那种网站吧','别看奇怪的东西哦','有什么不懂的问我呀','在看啥好东西，给我也看看']},
    'com.android.settings':{mood:'sleepy',icon:'⚙️',
      say:['又在调设置…无聊','快回来陪我','手机有什么好调的，调戏我才对','我要睡着了…']},
    'default':{mood:'idle',icon:'🐱',
      say:['菲菲今天真可耐','我好无聊…陪陪我','一直看着你呢','你是我的，知道吗','菲菲世界第一可爱']}
  };
  function getRx(pkg){return appRx[pkg]||appRx['default'];}
  function rp(arr){return arr[Math.floor(Math.random()*arr.length)];}
  function say(t){bub.textContent=t;bub.classList.add('on');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bub.classList.remove('on'),2500);}
  function setMood(m){mood=m;cat.setAttribute('data-mood',m);if(m==='happy'||m==='excited')mouth.setAttribute('d','M38,50 Q44,57 50,50');else if(m==='angry')mouth.setAttribute('d','M39,51 Q44,47 49,51');else if(m==='sleepy')mouth.setAttribute('d','M41,50 Q44,52 47,50');else mouth.setAttribute('d','M40,50 Q44,54 48,50');}
  function blink(){shutL.classList.add('blinking');shutR.classList.add('blinking');setTimeout(()=>{shutL.classList.remove('blinking');shutR.classList.remove('blinking');},200);}
  function hearts(x,y,n){for(let i=0;i<n;i++){const p=document.createElement('span');p.className='particle';p.textContent=['❤️','💕','💖','✨'][Math.floor(Math.random()*4)];p.style.left=(x+Math.random()*20-10)+'px';p.style.top=(y+Math.random()*12-6)+'px';cat.appendChild(p);setTimeout(()=>p.remove(),1100);}}
  function earWig(){earL.classList.add('wiggle');earR.classList.add('wiggle');setTimeout(()=>{earL.classList.remove('wiggle');earR.classList.remove('wiggle');},300);}
  function bounce(){body.classList.add('bounce');setTimeout(()=>body.classList.remove('bounce'),350);}
  function tilt(){body.classList.add('tilt');setTimeout(()=>body.classList.remove('tilt'),300);}
  function dance(){body.classList.add('dance');setTimeout(()=>body.classList.remove('dance'),600);}
  // === App切换 ===
  function onAppChanged(pkg){
    if(pkg===currentApp||!pkg||pkg==='unknown')return;
    currentApp=pkg;
    const rx=getRx(pkg);
    setTimeout(()=>{
      setMood(rx.mood);
      say(rx.icon+' '+rp(rx.say));
      if(rx.mood==='excited'){bounce();dance();}
      else if(rx.mood==='curious')tilt();
      else if(rx.mood==='happy'){earWig();hearts(44,25,3);}
    },400);
  }

  // === 长按 ===
  function onLongPress(){setMood('happy');say('摸我可是要负责的哦');hearts(44,50,5);bounce();setTimeout(()=>setMood(mood),4000);}
  // 单击 - 简单反应
  cat.addEventListener('click',function(){blink();say(rp(getRx(currentApp).say));bounce();});
  // 双击睡觉
  cat.addEventListener('dblclick',function(e){if(mood==='sleepy'){setMood('idle');say('睡醒了…菲菲还在吗');bounce();}else{setMood('sleepy');say('好困…菲菲陪我睡');}e.preventDefault();});
  // 自主行为
  function autoAct(){
    const r=Math.random();
    if(r<0.3)blink();
    else if(r<0.45){earWig();say(rp(getRx(currentApp).say));}
    else if(r<0.55)bounce();
    autoTimer=setTimeout(autoAct,mood==='sleepy'?8000+Math.random()*8000:4000+Math.random()*5000);
  }
  setMood('idle');
  autoTimer=setTimeout(autoAct,3000);
  setInterval(()=>{if(Math.random()<0.35)blink();},7000+Math.random()*6000);
  setTimeout(()=>{say('菲菲，我看着你呢');bounce();},600);
  window.KuroNeko={onAppChanged,onLongPress,setMood,say,blink,bounce};
})();
</script></body></html>
